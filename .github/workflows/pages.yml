name: Deploy public dashboard to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['static/**', 'templates/index.html', 'scripts/prepare_site.py', 'providers/nasa_firms.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Jinja2==3.1.6 httpx==0.28.1
      - run: python -m scripts.prepare_site --github-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/github-pages
      - uses: actions/deploy-pages@v4
        id: deployment
