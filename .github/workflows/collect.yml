name: Collect satellite and weather data
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
concurrency:
  group: ignis-collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-collector.txt
      - run: python -m scripts.collect
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          IGNIS_SITE_URL: ${{ vars.IGNIS_SITE_URL }}
          IGNIS_COLLECTOR_TOKEN: ${{ secrets.IGNIS_COLLECTOR_TOKEN }}
