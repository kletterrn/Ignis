[project]
name = "ignis-pilot"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Flask>=3.1,<4",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    "numpy>=2,<3",
    "rasterio>=1.4,<2",
    "Pillow>=11,<13",
    "opencv-python-headless>=4.12,<5",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "pylocron==0.3.0",
    "onnxruntime>=1.22,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
